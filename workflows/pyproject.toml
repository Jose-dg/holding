[project]
name = "workflows"
version = "0.1.0"
description = "Frappe App"
authors = [{name="José Ojeda", email="info@diem.com.co"}]
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "cryptography>=42.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["workflows*"]
exclude = ["tests*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E","F","I"]